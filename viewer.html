<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Amanos Avatar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;height:100vh}
  #panel{width:280px;padding:16px;background:#1b1b1b;display:flex;flex-direction:column;gap:12px;overflow:auto}
  #panel label{font-size:13px;display:flex;flex-direction:column;gap:4px}
  #panel .row{flex-direction:row;align-items:center;gap:8px}
  button{padding:8px;border:0;border-radius:6px;background:#3b82f6;color:#fff;cursor:pointer;font-weight:600}
  button.rec{background:#dc2626}
  #stage{flex:1;position:relative}
  canvas{display:block}
  #status{font-size:12px;color:#aaa;white-space:pre-line}
</style>
</head>
<body>
<div id="panel">
  <b>Amanos, avatar de senas</b>
  <label>1. Avatar (.vrm, VRM 0.x)<input type="file" id="vrmFile" accept=".vrm"></label>
  <label>2. Sena (.json de extract_landmarks.py)<input type="file" id="jsonFile" accept=".json"></label>
  <label>Velocidad <input type="range" id="speed" min="0.25" max="1.5" step="0.05" value="1"></label>
  <label class="row"><input type="checkbox" id="loop" checked> Loop</label>
  <label class="row"><input type="checkbox" id="swap" checked> Intercambiar manos (si los dedos salen en la mano equivocada, desmarcalo)</label>
  <label class="row"><input type="checkbox" id="useFace" checked> Expresion facial</label>
  <label>Fondo <input type="color" id="bg" value="#00b140"></label>
  <label>Frame del video <input type="range" id="scrub" min="0" max="0" value="0"></label>
  <button id="play">Reproducir video</button>
  <hr style="border-color:#333;width:100%">
  <b>Keyframes (animacion limpia)</b>
  <div style="font-size:12px;color:#aaa">Mueve "Frame del video" hasta una pose buena y dale Agregar. 2 a 4 poses bastan.</div>
  <button id="addKey">Agregar keyframe</button>
  <div id="keyList" style="font-size:12px">0 keyframes</div>
  <label>Segundos por tramo <input type="number" id="segDur" value="0.6" step="0.1" min="0.1"></label>
  <label class="row"><input type="checkbox" id="pingpong"> Ida y vuelta (para senas que se repiten)</label>
  <button id="playKeys">Reproducir keyframes</button>
  <button id="clearKeys" style="background:#555">Borrar keyframes</button>
  <button id="saveKeys" style="background:#555">Guardar keyframes (.json)</button>
  <label>Cargar keyframes <input type="file" id="loadKeys" accept=".json"></label>
  <hr style="border-color:#333;width:100%">
  <button id="rec" class="rec">Grabar sena (.webm)</button>
  <div id="status">Carga un avatar y una sena.</div>
</div>
<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.133.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.133.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.133.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
<script>
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;
const { Pose, Hand, Face, Vector, Utils } = Kalidokit;
const lerp = Vector.lerp, clamp = Utils.clamp;

// ---------- escena ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color($('bg').value);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 1.3, 2.2);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.update();
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(1, 1, 1).normalize();
scene.add(light, new THREE.AmbientLight(0xffffff, 0.4));

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
$('bg').oninput = e => scene.background = new THREE.Color(e.target.value);

// encuadre automatico: cabeza a cintura
function frameCamera() {
  vrm.scene.updateMatrixWorld(true);
  const head = vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.Head);
  const hy = head ? head.getWorldPosition(new THREE.Vector3()).y : 1.4;
  controls.target.set(0, hy - 0.25, 0);
  camera.position.set(0, hy - 0.2, 2.4);
  controls.update();
}

// ---------- estado ----------
let vrm = null, data = null, playing = false, t = 0, recorder = null;
let mode = 'video', keys = [], kt = 0;
const BONES = Object.values(THREE.VRMSchema.HumanoidBoneName);
const oldLook = new THREE.Euler();

// ---------- carga de archivos ----------
$('vrmFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  status('Cargando avatar...');
  const buf = await f.arrayBuffer();
  new THREE.GLTFLoader().parse(buf, '', gltf => {
    THREE.VRMUtils.removeUnnecessaryJoints(gltf.scene);
    THREE.VRM.from(gltf).then(v => {
      if (vrm) scene.remove(vrm.scene);
      vrm = v; scene.add(v.scene);
      v.scene.rotation.y = Math.PI;   // mirando a la camara
      frameCamera();
      status('Avatar listo. ' + (data ? 'Dale Reproducir.' : 'Ahora carga la sena.'));
    }).catch(err => status('Error VRM (usa VRM 0.x): ' + err));
  }, err => status('Error leyendo el archivo: ' + err));
};

$('jsonFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  data = JSON.parse(await f.text());
  // recorta las partes donde las manos estan abajo (inicio y final)
  const act = data.frames.map(fr => !!(fr.leftHand || fr.rightHand));
  const pad = Math.round(data.fps * 0.3);
  const a = Math.max(0, act.indexOf(true) - pad);
  const b = Math.min(data.frames.length, act.lastIndexOf(true) + 1 + pad);
  if (act.includes(true)) data.frames = data.frames.slice(a, b);
  t = 0;
  $('scrub').max = data.frames.length - 1; $('scrub').value = 0;
  status(`Sena "${data.name}": ${data.frames.length} frames a ${Math.round(data.fps)} fps.`);
};

// ---------- rig ----------
function rigRotation(name, rot = { x: 0, y: 0, z: 0 }, damp = 1, amt = 0.3) {
  if (!vrm || !rot) return;
  const bone = vrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName[name]);
  if (!bone) return;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rot.x * damp, rot.y * damp, rot.z * damp));
  bone.quaternion.slerp(q, amt);
}

const FINGERS = ['Ring', 'Index', 'Little', 'Thumb', 'Middle'];
const JOINTS = ['Proximal', 'Intermediate', 'Distal'];

function rigHand(side, lm, riggedPose) {
  const rh = Hand.solve(lm, side);
  if (!rh) return;
  const wrist = rh[side + 'Wrist'];
  rigRotation(side + 'Hand', {
    z: riggedPose && riggedPose[side + 'Hand'] ? riggedPose[side + 'Hand'].z : wrist.z,
    y: wrist.y, x: wrist.x
  });
  for (const fi of FINGERS) for (const j of JOINTS) rigRotation(side + fi + j, rh[side + fi + j]);
}

function relaxHand(side) {
  for (const fi of FINGERS) for (const j of JOINTS) rigRotation(side + fi + j, { x: 0, y: 0, z: 0 }, 1, 0.1);
}

function rigFace(lm, imageSize) {
  const rf = Face.solve(lm, { runtime: 'mediapipe', imageSize, smoothBlink: false });
  if (!rf) return;
  rigRotation('Neck', { x: rf.head.x, y: rf.head.y, z: clamp(rf.head.z, -0.15, 0.15) }, 0.4);
  const bs = vrm.blendShapeProxy, P = THREE.VRMSchema.BlendShapePresetName;
  if (!bs) return;
  bs.setValue(P.Blink, 0);   // ojos siempre abiertos (el parpadeo detectado es muy ruidoso)
  for (const k of ['I', 'A', 'E', 'O', 'U'])
    bs.setValue(P[k], lerp(rf.mouth.shape[k], bs.getValue(P[k]), 0.5));
  const look = new THREE.Euler(lerp(oldLook.x, rf.pupil.y, 0.4), lerp(oldLook.y, rf.pupil.x, 0.4), 0, 'XYZ');
  oldLook.copy(look);
  if (vrm.lookAt && vrm.lookAt.applyer) vrm.lookAt.applyer.lookAt(look);
}

function applyFrame(f) {
  const imageSize = { width: data.width, height: data.height };
  let rp = null;
  if (f.pose && f.poseWorld) {
    rp = Pose.solve(f.poseWorld, f.pose, { runtime: 'mediapipe', imageSize, enableLegs: false });
    if (rp) {
      rigRotation('Hips', rp.Hips.rotation, 0.4);
      rigRotation('Chest', rp.Spine, 0.25);
      rigRotation('Spine', rp.Spine, 0.45);
      rigRotation('RightUpperArm', rp.RightUpperArm);
      rigRotation('RightLowerArm', rp.RightLowerArm);
      rigRotation('LeftUpperArm', rp.LeftUpperArm);
      rigRotation('LeftLowerArm', rp.LeftLowerArm);
    }
  }
  const swap = $('swap').checked;
  const L = swap ? f.rightHand : f.leftHand;
  const R = swap ? f.leftHand : f.rightHand;
  if (L) rigHand('Left', L, rp); else relaxHand('Left');
  if (R) rigHand('Right', R, rp); else relaxHand('Right');
  if ($('useFace').checked && f.face) rigFace(f.face, imageSize);
}

// ---------- keyframes ----------
function snapshot() {
  const k = {};
  for (const b of BONES) { const n = vrm.humanoid.getBoneNode(b); if (n) k[b] = n.quaternion.toArray(); }
  return k;
}
function showFrame(i) {               // aplica un frame del video hasta que converge
  for (let n = 0; n < 40; n++) applyFrame(data.frames[i]);
}
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function keySeq() { return $('pingpong').checked && keys.length > 1 ? keys.concat(keys.slice(0, -1).reverse()) : keys; }
function keysTotal() { const s = parseFloat($('segDur').value) || 0.6; return Math.max(0, keySeq().length - 1) * s + 0.6; }
function applyKeys(time) {
  const seq = keySeq(), seg = parseFloat($('segDur').value) || 0.6;
  if (!seq.length) return;
  let tt = Math.max(0, time - 0.3);                 // 0.3 s quieto al inicio
  let i = Math.min(Math.floor(tt / seg), seq.length - 1);
  const a = seq[i], b = seq[Math.min(i + 1, seq.length - 1)];
  const x = i >= seq.length - 1 ? 0 : ease((tt - i * seg) / seg);
  const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
  for (const bn of BONES) {
    const n = vrm.humanoid.getBoneNode(bn); if (!n || !a[bn] || !b[bn]) continue;
    qa.fromArray(a[bn]); qb.fromArray(b[bn]); n.quaternion.copy(qa).slerp(qb, x);
  }
}
const listKeys = () => $('keyList').textContent = keys.length + ' keyframes';

$('scrub').oninput = e => {
  if (!vrm || !data) return;
  playing = false; mode = 'video'; $('play').textContent = 'Reproducir video';
  t = +e.target.value / data.fps; showFrame(+e.target.value);
};
$('addKey').onclick = () => {
  if (!vrm || !data) return status('Carga avatar y sena primero.');
  showFrame(+$('scrub').value); keys.push(snapshot()); listKeys();
};
$('clearKeys').onclick = () => { keys = []; listKeys(); };
$('playKeys').onclick = () => {
  if (keys.length < 2) return status('Necesitas al menos 2 keyframes.');
  mode = 'keys'; kt = 0; playing = true; $('play').textContent = 'Pausa';
};
$('saveKeys').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ name: data ? data.name : 'sena', segDur: +$('segDur').value, pingpong: $('pingpong').checked, keys })], { type: 'application/json' }));
  a.download = (data ? data.name : 'sena') + '.keys.json'; a.click();
};
$('loadKeys').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const k = JSON.parse(await f.text());
  keys = k.keys || []; $('segDur').value = k.segDur || 0.6; $('pingpong').checked = !!k.pingpong; listKeys();
};

// ---------- loop ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  const speed = parseFloat($('speed').value);
  if (vrm && playing && mode === 'video' && data) {
    t += dt * speed;
    let i = Math.floor(t * data.fps);
    if (i >= data.frames.length) {
      if (recorder) recorder.stop();
      if ($('loop').checked && !recorder) { t = 0; i = 0; }
      else { i = data.frames.length - 1; playing = false; $('play').textContent = 'Reproducir video'; }
    }
    $('scrub').value = i;
    applyFrame(data.frames[i]);
  }
  if (vrm && playing && mode === 'keys') {
    kt += dt * speed;
    if (kt > keysTotal()) {
      if (recorder) recorder.stop();
      if ($('loop').checked && !recorder) kt = 0; else { kt = keysTotal(); playing = false; $('play').textContent = 'Reproducir video'; }
    }
    applyKeys(kt);
  }
  if (vrm) vrm.update(dt);
  renderer.render(scene, camera);
}
tick();

$('play').onclick = () => {
  if (!vrm || !data) return status('Falta cargar avatar o sena.');
  if (mode !== 'video') { mode = 'video'; playing = false; }
  playing = !playing; if (playing && t * data.fps >= data.frames.length) t = 0;
  $('play').textContent = playing ? 'Pausa' : 'Reproducir video';
};

// ---------- grabar una pasada (video o keyframes, segun lo ultimo que reprodujiste) ----------
$('rec').onclick = () => {
  if (!vrm) return status('Falta cargar el avatar.');
  if (mode === 'video' && !data) return status('Falta cargar la sena.');
  if (recorder) return;
  const chunks = [];
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  recorder = new MediaRecorder(renderer.domElement.captureStream(30), { mimeType: mime, videoBitsPerSecond: 6e6 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = (data ? data.name : 'sena') + (mode === 'keys' ? '-keys' : '') + '.webm'; a.click();
    recorder = null; status('Listo, se descargo ' + a.download);
  };
  t = 0; kt = 0; playing = true; $('play').textContent = 'Pausa';
  recorder.start(); status('Grabando una pasada...');
};
</script>
</body>
</html>
